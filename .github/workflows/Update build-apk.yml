name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Gradle project and build APK
        run: |
          # Find directory containing build.gradle or settings.gradle
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
          
          if [ -z "$GRADLE_FILE" ]; then
            echo "No Gradle project found!"
            exit 1
          fi
          
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "Found Gradle project at: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          if [ -f "gradlew" ]; then
            echo "Found gradlew"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found, using gradle"
            gradle assembleDebug
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/*/*.apk
