name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # المستودع يحتوي ملف zip للمشروع مو مشروع مفكوك — نفكه هون قبل أي خطوة بناء.
      # لو المحتوى ملفوف بمجلد واحد إضافي جوه الـ zip، نسحب محتواه لجذر الـ workspace تلقائياً.
      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ما لقيت أي ملف zip.. بجذر المستودع"
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          mkdir -p _extracted
          unzip -o "$ZIP_FILE" -d _extracted

          SRC="_extracted"
          TOP_ENTRIES=$(ls -A "$SRC")
          TOP_COUNT=$(echo "$TOP_ENTRIES" | grep -c .)
          if [ "$TOP_COUNT" -eq 1 ] && [ -d "$SRC/$TOP_ENTRIES" ]; then
            SRC="$SRC/$TOP_ENTRIES"
          fi

          cp -a "$SRC"/. .
          rm -rf _extracted
          echo "--- محتوى جذر المشروع بعد الفك ---"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # المشروع لا يحتوي على gradlew/gradle-wrapper.jar، فنولّدهما هنا
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comic-translator-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            feature_ai/build/outputs/apk/debug/feature_ai-debug.apk

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
