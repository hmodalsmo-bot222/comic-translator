name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP and Build APK
        run: |
          echo "=== Files in repo root ==="
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "ZIP found: $ZIP_FILE"
          
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE"
            echo "ZIP extracted"
          fi
          
          GRADLE_FILE=$(find . -name "build.gradle" -not -path "./.github/*" | head -1)
          echo "Gradle file: $GRADLE_FILE"
          
          if [ -z "$GRADLE_FILE" ]; then
            echo "No Gradle project found!"
            exit 1
          fi
          
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "Building in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/*/*.apk
