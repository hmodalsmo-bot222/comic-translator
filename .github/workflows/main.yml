name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # تحديد إصدارات تتوافق مع المكتبات الحديثة وتضمين CMake و NDK لـ PaddleOCR
          build-tools-version: "34.0.0"
          sdk-version: "34"
          ndk-version: "25.1.8937393"
          cmake-version: "3.22.1"

      - name: Extract ZIP and Build APK
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE"
          fi
          
          GRADLE_FILE=$(find . -name "build.gradle" -not -path "./.github/*" | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "No Gradle project found!"
            exit 1
          fi
          
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          cd "$GRADLE_DIR"
          
          # ربط مسار الـ SDK بملف local.properties لكي يراه Gradle بوضوح
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # تفعيل AndroidX و Jetifier
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # استخدامgradlew المرفق في المشروع إن وجد (أفضل وأضمن من تحميل gradle يدوياً)
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            # تحميل Gradle 8.5 في حال لم يكن الـ wrapper موجوداً
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q gradle-8.5-bin.zip
            export PATH=$PWD/gradle-8.5/bin:$PATH
            gradle assembleDebug
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/*/*.apk
