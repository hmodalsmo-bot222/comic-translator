name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools-version: "34.0.0"
          sdk-version: "34"
          ndk-version: "25.1.8937393"
          cmake-version: "3.22.1"

      - name: Extract ZIP, Patch Gradle, and Build APK
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE"
          fi
          
          GRADLE_FILE=$(find . -name "build.gradle" -not -path "./.github/*" | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "No Gradle project found!"
            exit 1
          fi
          
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          cd "$GRADLE_DIR"
          
          # ربط مسار الـ SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # تفعيل AndroidX و Jetifier
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # تعديل app/build.gradle لضبط الـ namespace وإضافة kapt وتجنب أخطاء التجميع
          python3 -c "
          import os, re
          app_gradle_path = 'app/build.gradle'
          if os.path.exists(app_gradle_path):
              with open(app_gradle_path, 'r') as f:
                  content = f.read()
              
              # التأكد من وجود namespace
              if 'namespace' not in content:
                  content = re.sub(r'android\s*\{', 'android {\n    namespace \"com.comictrans\"', content)
              
              # إضافة kapt للـ plugins
              if 'kotlin-kapt' not in content:
                  if 'plugins {' in content:
                      content = content.replace('plugins {', 'plugins {\n    id \'kotlin-kapt\'')
              
              # إضافة مستلزمات Room إذا لم تكن موجودة
              if 'androidx.room:room-runtime' not in content:
                  if 'dependencies {' in content:
                      content = content.replace('dependencies {', 'dependencies {\n    implementation \"androidx.room:room-runtime:2.6.1\"\n    implementation \"androidx.room:room-ktx:2.6.1\"\n    kapt \"androidx.room:room-compiler:2.6.1\"')
              
              with open(app_gradle_path, 'w') as f:
                  f.write(content)
              print('Successfully patched app/build.gradle')
          "

          # إنشاء أيقونات افتراضية لتفادي أخطاء الموارد
          mkdir -p app/src/main/res/mipmap-mdpi
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4Z"/></vector>' > app/src/main/res/mipmap-mdpi/ic_launcher.xml
          cp app/src/main/res/mipmap-mdpi/ic_launcher.xml app/src/main/res/mipmap-mdpi/ic_launcher_round.xml
          
          # تنظيف وبناء المشروع متجاوزاً أخطاء الـ Lint
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug -x lint
          else
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q gradle-8.5-bin.zip
            export PATH=$PWD/gradle-8.5/bin:$PATH
            gradle clean assembleDebug -x lint
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/*/*.apk
