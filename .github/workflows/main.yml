name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project archive (if repo has a zipped copy instead of raw files)
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 1 -iname '*.zip' -print -quit)"
          if [ -n "$zip_file" ]; then
            echo "==> Found archive: $zip_file — extracting into repo root"
            tmpdir="$(mktemp -d)"
            unzip -q "$zip_file" -d "$tmpdir"

            # If everything inside the zip is wrapped in one top-level folder
            # (e.g. comic-translator-v3/...), flatten it so app/, scripts/,
            # settings.gradle etc. end up directly at the repo root.
            mapfile -t entries < <(find "$tmpdir" -mindepth 1 -maxdepth 1)
            if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmpdir"
            fi

            cp -a "$src"/. .
            rm -rf "$tmpdir"
            echo "==> Extraction complete. Repo root now contains:"
            ls -la
          else
            echo "==> No .zip found at repo root — assuming project files are already unpacked."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK/CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare official Paddle-Lite 2.10 runtime and PP-OCRv2 slim models
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/ensure_paddle.sh
          ./scripts/ensure_paddle.sh

      - name: Verify Paddle inputs immediately before Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -s app/.paddle/inference_lite_lib.android.armv8/cxx/include/paddle_api.h
          test -s app/.paddle/inference_lite_lib.android.armv8/cxx/lib/libpaddle_light_api_shared.so
          test -s app/src/main/assets/paddle/det.nb
          test -s app/src/main/assets/paddle/rec.nb
          test -s app/src/main/assets/paddle/cls.nb
          test -s app/src/main/assets/paddle/ppocr_keys_v1.txt
          echo "Paddle inputs verified immediately before Gradle."
          find app/.paddle/inference_lite_lib.android.armv8/cxx -maxdepth 2 -type f -printf '%p %k KB\n' | sort
          find app/src/main/assets/paddle -maxdepth 1 -type f -printf '%p %k KB\n' | sort

      - name: Package NDK C++ shared runtime
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$ANDROID_SDK_ROOT/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          test -s app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Validate Android/Paddle build inputs
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"
          test -f app/.paddle/inference_lite_lib.android.armv8/cxx/include/paddle_api.h
          test -s app/.paddle/inference_lite_lib.android.armv8/cxx/lib/libpaddle_light_api_shared.so
          test -s app/src/main/assets/paddle/det.nb
          test -s app/src/main/assets/paddle/rec.nb
          test -s app/src/main/assets/paddle/cls.nb
          test -s app/src/main/assets/paddle/ppocr_keys_v1.txt
          test -s app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comic-translator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
